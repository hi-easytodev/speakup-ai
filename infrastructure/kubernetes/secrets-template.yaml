apiVersion: v1
kind: Secret
metadata:
  name: speakup-secrets
  namespace: speakup-ai
type: Opaque
stringData:
  gemini-api-key: YOUR_GEMINI_API_KEY_HERE
  jwt-secret: YOUR_JWT_SECRET_HERE
  postgres-url: postgresql://user:password@postgres:5432/speakup_ai
  mongodb-url: mongodb://user:password@mongodb:27017/speakup_ai
  redis-url: redis://:password@redis:6379/0
